<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Matematik Macerası">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="8-12 yaş için eğlenceli matematik platform oyunu. Canavarları yen, soruları yanıtla!">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <title>Matematik Macerası</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── Game canvas wrapper ── -->
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- ── On-screen touch controls ── -->
    <div id="touch-controls" class="hidden">
      <div id="left-pad">
        <button id="btn-left"  class="ctrl-btn" aria-label="Sola git">&#9664;</button>
        <button id="btn-right" class="ctrl-btn" aria-label="Sağa git">&#9654;</button>
      </div>
      <div id="right-pad">
        <button id="btn-jump" class="ctrl-btn ctrl-jump" aria-label="Zıpla">&#8679;</button>
      </div>
    </div>
  </div>

  <!-- ── Math question overlay (DOM — for native mobile keyboard) ── -->
  <div id="question-overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Matematik Sorusu">
    <div id="question-card">
      <div id="question-header">
        <span class="box-icon">📦</span>
        <h2>Soru!</h2>
        <p class="subtitle">Doğru cevap ver, kalkan kazan!</p>
      </div>

      <div id="question-body">
        <p id="question-text" aria-live="polite"></p>

        <div id="input-row">
          <input
            type="number"
            id="answer-input"
            inputmode="numeric"
            pattern="[0-9\-]*"
            placeholder="?"
            autocomplete="off"
            min="-100"
            max="200"
            aria-label="Cevabınızı girin"
          >
          <button id="submit-btn" aria-label="Cevabı gönder">✓</button>
        </div>

        <div id="feedback" class="hidden" aria-live="assertive"></div>
      </div>

      <div id="timer-bar-container" title="Cevap süresi">
        <div id="timer-bar"></div>
      </div>
    </div>
  </div>

  <!-- ── QR code / install modal ── -->
  <div id="qr-modal" class="hidden" role="dialog" aria-modal="true" aria-label="Telefona Yükle">
    <div id="qr-box">
      <h2>📱 Telefona Yükle</h2>
      <p>QR kodu okut veya aşağıdaki bağlantıya git:</p>
      <canvas id="qr-canvas"></canvas>
      <p id="qr-url-text" class="qr-url"></p>
      <ol class="install-steps">
        <li><strong>iPhone/iPad:</strong> Safari → Paylaş → Ana Ekrana Ekle</li>
        <li><strong>Android:</strong> Chrome → Menü → Ana Ekrana Ekle</li>
      </ol>
      <button id="close-qr-btn">Kapat</button>
    </div>
  </div>

  <!-- Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <!-- QR Code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- Game entry (ES modules) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
