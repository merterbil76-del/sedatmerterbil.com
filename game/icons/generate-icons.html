<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Icon Generator — Matematik Macerası</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; background: #1a1a2e; color: #fff; }
    h2 { color: #FFD700; }
    canvas { border-radius: 16px; margin: 10px; }
    button {
      padding: 10px 24px; font-size: 16px; background: #27AE60;
      color: #fff; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px;
    }
    a { display: inline-block; margin: 6px; color: #89CFF0; }
    p { color: #AAA; margin: 8px 0; }
  </style>
</head>
<body>
  <h2>📦 Icon Generator</h2>
  <p>Bu sayfa icon-192.png ve icon-512.png dosyalarını oluşturur.<br>
     İndirilen dosyaları <code>game/icons/</code> klasörüne kopyalayın.</p>

  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>

  <br>
  <div id="links"></div>

  <script>
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const s = w / 192; // scale factor

      // Background
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#1A3A6E');
      grad.addColorStop(1, '#0D1F3C');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, w, h, 32 * s);
      ctx.fill();

      // Ground
      ctx.fillStyle = '#5DAD4C';
      ctx.fillRect(0, 148 * s, w, 20 * s);
      ctx.fillStyle = '#8B5E3C';
      ctx.fillRect(0, 165 * s, w, 27 * s);

      // Mystery Box
      ctx.fillStyle = '#E67E22';
      const bx = 68 * s, by = 88 * s, bw = 56 * s;
      roundRect(ctx, bx, by, bw, bw, 6 * s);
      ctx.fill();
      ctx.strokeStyle = '#D35400';
      ctx.lineWidth = 3 * s;
      ctx.strokeRect(bx + 3 * s, by + 3 * s, bw - 6 * s, bw - 6 * s);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 ${38 * s}px "Arial Black", Impact`;
      ctx.textAlign = 'center';
      ctx.fillText('?', 96 * s, 130 * s);

      // Character
      ctx.fillStyle = '#2980B9';
      ctx.beginPath();
      ctx.arc(48 * s, 130 * s, 16 * s, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FDE3A7';
      ctx.beginPath();
      ctx.arc(48 * s, 124 * s, 10 * s, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(44 * s, 123 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(52 * s, 123 * s, 3 * s, 0, Math.PI * 2); ctx.fill();

      // Legs
      ctx.fillStyle = '#C0392B';
      roundRect(ctx, 40 * s, 140 * s, 7 * s, 8 * s, 2 * s); ctx.fill();
      roundRect(ctx, 50 * s, 140 * s, 7 * s, 8 * s, 2 * s); ctx.fill();

      // Stars
      ctx.fillStyle = '#FFD700';
      ctx.font = `${18 * s}px Arial`;
      ctx.fillText('★', 22 * s, 50 * s);
      ctx.fillText('★', 154 * s, 50 * s);
      ctx.font = `${22 * s}px Arial`;
      ctx.fillText('★', 88 * s, 30 * s);

      // Title
      ctx.fillStyle = '#FFD700';
      ctx.font = `900 ${11 * s}px "Arial Black", Impact`;
      ctx.fillText('MATEMATİK', 96 * s, 82 * s);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    const c192 = document.getElementById('c192');
    const c512 = document.getElementById('c512');

    drawIcon(c192);
    drawIcon(c512);

    const links = document.getElementById('links');
    ['icon-192.png', 'icon-512.png'].forEach((name, i) => {
      const canvas = [c192, c512][i];
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = name;
      a.textContent = `⬇ ${name} indir`;
      links.appendChild(a);
      links.appendChild(document.createElement('br'));
    });
  </script>
</body>
</html>
