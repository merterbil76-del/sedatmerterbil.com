<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3A6E"/>
      <stop offset="100%" stop-color="#0D1F3C"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>

  <!-- Ground -->
  <rect x="0" y="148" width="192" height="44" rx="0" fill="#5DAD4C"/>
  <rect x="0" y="160" width="192" height="32" fill="#8B5E3C"/>

  <!-- Mystery Box -->
  <rect x="68" y="88" width="56" height="56" rx="6" fill="#E67E22"/>
  <rect x="71" y="91" width="50" height="50" rx="4" fill="none" stroke="#D35400" stroke-width="3"/>
  <text x="96" y="130" font-family="Arial Black, Impact" font-size="38" font-weight="900"
        text-anchor="middle" fill="white">?</text>

  <!-- Character (simple) -->
  <circle cx="48" cy="130" r="16" fill="#2980B9"/>
  <circle cx="48" cy="124" r="10" fill="#FDE3A7"/>
  <circle cx="44" cy="123" r="3" fill="#111"/>
  <circle cx="52" cy="123" r="3" fill="#111"/>
  <!-- Legs -->
  <rect x="40" y="140" width="7" height="8" rx="2" fill="#C0392B"/>
  <rect x="50" y="140" width="7" height="8" rx="2" fill="#C0392B"/>

  <!-- Stars -->
  <text x="22" y="50" font-size="18" fill="#FFD700">★</text>
  <text x="154" y="50" font-size="18" fill="#FFD700">★</text>
  <text x="88" y="30" font-size="22" fill="#FFD700">★</text>

  <!-- Title text -->
  <text x="96" y="82" font-family="Arial Black, Impact" font-size="11" font-weight="900"
